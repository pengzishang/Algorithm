name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest ]
    steps:
      - uses: actions/checkout@v4
      - name: Environment diagnostics
        run: |
          echo "--- sw_vers ---"
          sw_vers || true
          echo "--- uname -a ---"
          uname -a || true
          echo "--- swift --version ---"
          swift --version || true
      - name: Report Swift version
        run: |
          # Package.swift already declares swift-tools-version: 6.1, so the
          # toolchain enforces the minimum. This step only reports, it does not
          # pin an exact patch release (which used to fail on newer runners).
          swift --version
          MAJOR=$(swift -version 2>&1 | head -n1 | grep -oE 'version [0-9]+\.[0-9]+' | grep -oE '[0-9]+\.[0-9]+')
          echo "Detected Swift $MAJOR (minimum required: 6.1 via Package.swift)"
          if [ "$(printf '%s\n6.1\n' "$MAJOR" | sort -V | head -n1)" != "6.1" ]; then
            echo "::error::Swift $MAJOR is older than the required 6.1"
            exit 1
          fi
      - name: Run tests
        run: swift test --parallel
